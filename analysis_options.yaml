# Static analysis configuration.
#
# Extends `flutter_lints` (Flutter's recommended set) with a stricter, curated
# rule set. We intentionally do NOT enable `public_member_api_docs`: it forces a
# doc comment on every field/getter, which produces noise that restates the code
# and fights the project's KISS philosophy. Documentation standards are covered
# in CLAUDE.md §7 instead. Generated files are excluded — we don't control their
# style.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/generated/**"
  errors:
    # Noisy false-positive with freezed + json_serializable `@JsonKey` usage.
    invalid_annotation_target: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Correctness / safety
    - always_declare_return_types
    - avoid_print
    - avoid_positional_boolean_parameters
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return

    # Consistency / style
    - always_use_package_imports
    - combinators_ordering
    - directives_ordering
    - prefer_single_quotes
    - require_trailing_commas
    - unnecessary_library_directive

    # Immutability / performance
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - use_super_parameters

    # Redundancy removal
    - avoid_redundant_argument_values
    - avoid_unnecessary_containers
    - prefer_if_null_operators
    - prefer_interpolation_to_compose_strings
    - sized_box_for_whitespace
    - unnecessary_lambdas
    - unnecessary_parenthesis
